name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10; trusted publishing (OIDC) needs npm 11.5.1+.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Select npm tag
        id: npm-tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: with none set, npm falls back to OIDC trusted
      # publishing. An empty token would suppress that fallback.
      - name: Publish package
        env:
          NPM_TAG: ${{ steps.npm-tag.outputs.value }}
        run: npm publish --tag "$NPM_TAG" --access public --provenance
