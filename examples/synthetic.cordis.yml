# Host-plane row: it registers a provider into the process-wide `web` service.
# Install the package into the target profile before adding this row.
# `dsh plugin --profile web add @auggieteo/dsh-synthetic-web-search` mounts
# these rows through the shipped bundle; this file is the manual equivalent.
- id: synthetic-web-search
  name: '@auggieteo/dsh-synthetic-web-search'
  config:
    # The card stores its key under this DSH credential reference.
    # On 0.1.7-rc.2 and later, `apiKeyEnv` and `baseURL` are also editable
    # live on the sidebar Plugins page; these values are the base layer.
    # apiKeyEnv: SYNTHETIC_API_KEY
    # baseURL: https://api.synthetic.new

# Overrides DSH's shipped deepseek-official selection.
- id: web
  config:
    searchProvider: synthetic
