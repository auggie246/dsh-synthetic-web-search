# Bundle patch for @auggieteo/dsh-synthetic-web-search: inserts its host row and
# selects Synthetic for web search. `dsh plugin --profile web add <this package>`
# appends this bundle after DSH's base bundle, so this later row override replaces
# the shipped `deepseek-official` selection. Client roster entries come from the
# dsh.client block in package.json — no row needed here.

- insert:
    - id: synthetic-web-search
      name: "@auggieteo/dsh-synthetic-web-search"

- id: web
  config:
    searchProvider: synthetic
